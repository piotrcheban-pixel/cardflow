name: CI

# Матрица SPEC B3/итерация 0: ubuntu + windows + macos.
# Сборки iOS — на macOS-раннере без подписи.
# ВАЖНО: GitHub-remote на момент итерации 0 отсутствует, прогон не выполнялся
# (journal/KNOWN_LIMITATIONS.md, L3).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_ACTION_CHANNEL: stable

jobs:
  quality:
    name: format + analyze (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: fvm
        uses: kuhnroyal/flutter-fvm-config-action@v3.3
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Пакеты и локализация
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Форматирование (dart format)
        run: dart format --output=none --set-exit-if-changed .
      - name: Анализатор (0 issues)
        run: flutter analyze --no-fatal-infos

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: fvm
        uses: kuhnroyal/flutter-fvm-config-action@v3.3
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Тесты (кроме golden)
        run: flutter test --exclude-tags golden --coverage
      - name: Покрытие рукописного кода >= 80%
        if: matrix.os == 'ubuntu-latest'
        run: dart run tool/coverage_check.dart --min=80
      - name: Загрузка lcov
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

  build-desktop:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            command: flutter build linux --release
          - name: windows
            os: windows-latest
            command: flutter build windows --release
          - name: macos
            os: macos-latest
            command: flutter build macos --release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: fvm
        uses: kuhnroyal/flutter-fvm-config-action@v3.3
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Системные зависимости Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev liblzma-dev ninja-build
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: ${{ matrix.command }}

  build-mobile:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android
            os: ubuntu-latest
          - name: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: fvm
        uses: kuhnroyal/flutter-fvm-config-action@v3.3
      - uses: actions/setup-java@v6.2.0
        if: matrix.name == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Сборка Android (debug, без подписи)
        if: matrix.name == 'android'
        run: flutter build apk --debug
      - name: Сборка iOS (release, без подписи)
        if: matrix.name == 'ios'
        run: flutter build ios --release --no-codesign
