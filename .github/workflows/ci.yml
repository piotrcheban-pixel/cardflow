name: CI

# Матрица SPEC B3/итерация 0: ubuntu + windows + macos.
# Сборки iOS — на macOS-раннере без подписи.
# CI-прогон итерации 1 (run 43436887755, commit 052d2a2) — зелёный:
# quality, test×3, build-desktop×3, build-mobile Android+iOS (L9/L9b сняты).
# Прогон итерации 2 упал инфраструктурно: "No space left on device" на раннере.
# Поэтому перед `flutter pub get` каждый job освобождает диск ("Free disk space"),
# а Android-сборка дополнительно чистит кэш Gradle перед сборкой.
# PDF-тесты (L26) получают PDFium явно и пинованно на всех трёх ОС: job test
# скачивает релиз bblanchon/pdfium-binaries chromium/8125 (тот же, что в
# build-hook pdfium_dart), проверяет sha256 и экспортирует PDFIUM_PATH ->
# pdfrxInitialize() грузит модуль по явному пути.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_ACTION_CHANNEL: stable

jobs:
  quality:
    name: format + analyze (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          echo "== df -h до очистки =="
          df -h
          if [ "$RUNNER_OS" = "Linux" ]; then
            # ubuntu-latest несёт ~15 GB предустановленных toolchain'ов, которые
            # проекту не нужны: удаляем их, чтобы раннер не упирался в диск.
            sudo rm -rf /usr/share/dotnet
            sudo rm -rf /usr/local/lib/android
            sudo rm -rf /opt/ghc
            sudo rm -rf /usr/local/share/boost
            sudo rm -rf /opt/hostedtoolcache/CodeQL
            if command -v docker >/dev/null 2>&1; then
              sudo docker image prune --all --force || true
            fi
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # macOS-раннер самый тесный (~14 GB): Android SDK и кэш Homebrew
            # проекту не нужны (iOS собирается без Android SDK).
            sudo rm -rf /Users/runner/Library/Android/sdk
            sudo rm -rf /Users/runner/Library/Caches/Homebrew
            sudo rm -rf /usr/local/share/dotnet
          fi
          echo "== df -h после очистки =="
          df -h
      - id: fvm
        uses: kuhnroyal/flutter-fvm-config-action@v3.3
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Пакеты и локализация
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Форматирование (dart format)
        run: dart format --output=none --set-exit-if-changed .
      - name: Анализатор (0 issues)
        run: flutter analyze

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          echo "== df -h до очистки =="
          df -h
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo rm -rf /usr/share/dotnet
            sudo rm -rf /usr/local/lib/android
            sudo rm -rf /opt/ghc
            sudo rm -rf /usr/local/share/boost
            sudo rm -rf /opt/hostedtoolcache/CodeQL
            if command -v docker >/dev/null 2>&1; then
              sudo docker image prune --all --force || true
            fi
          elif [ "$RUNNER_OS" = "macOS" ]; then
            sudo rm -rf /Users/runner/Library/Android/sdk
            sudo rm -rf /Users/runner/Library/Caches/Homebrew
            sudo rm -rf /usr/local/share/dotnet
          fi
          echo "== df -h после очистки =="
          df -h
      - id: fvm
        uses: kuhnroyal/flutter-fvm-config-action@v3.3
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: PDFium для PDF-тестов (Linux/macOS)
        # flutter test на Linux/macOS не находит PDFium сам (L26): Flutter engine
        # cache не содержит libpdfium, у pdfium_dart в тестовом окружении нет
        # bundled native asset, на macOS чистый Dart-загрузчик платформу не
        # поддерживает. Скачиваем тот же pinned релиз PDFium, что использует
        # build-hook pdfium_dart 0.4.1 (bblanchon/pdfium-binaries, chromium/8125),
        # сверяем sha256 и отдаём pdfrx через PDFIUM_PATH: pdfrxInitialize()
        # читает переменную и грузит модуль по явному пути.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              asset="pdfium-linux-x64.tgz"
              lib="lib/libpdfium.so"
              sha="e1c3ce6e270cb5e0c20816b379ad9f2c1309972697c505f508de92bf5e7d6659" ;;
            macOS)
              asset="pdfium-mac-arm64.tgz"
              lib="lib/libpdfium.dylib"
              sha="4939bd935ac83ddc09a3a4f038bc43a19cea1660316a3667f26cb07a070e139d" ;;
            *)
              echo "PDFium: неожиданная ОС $RUNNER_OS"
              exit 1 ;;
          esac
          tgz="$RUNNER_TEMP/pdfium.tgz"
          curl -fsSL --connect-timeout 20 --max-time 180 --retry 3 --retry-delay 2 \
            -o "$tgz" \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8125/$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "$sha  $tgz" | sha256sum -c -
          else
            echo "$sha  $tgz" | shasum -a 256 -c -
          fi
          dir="$RUNNER_TEMP/pdfium"
          mkdir -p "$dir"
          tar -xzf "$tgz" -C "$dir"
          if [ ! -f "$dir/$lib" ]; then
            echo "PDFium: в архиве $asset нет $lib"
            exit 1
          fi
          echo "PDFIUM_PATH=$dir/$lib" >> "$GITHUB_ENV"
          echo "PDFium для тестов: $dir/$lib"
      - name: PDFium для PDF-тестов (Windows)
        # Явный бутстрап и на Windows: тот же pinned релиз PDFium, что и для
        # Linux/macOS (L26), — механизм загрузки в flutter test не должен
        # зависеть от неявного native-assets окружения раннера.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'pdfium-win-x64.tgz'
          $sha = '9a964261760cff52570aabf038ab346d3a5034dd8b30d0d5fe8861235d356b8b'
          $tgz = Join-Path $env:RUNNER_TEMP 'pdfium.tgz'
          Invoke-WebRequest -Uri "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8125/$asset" -OutFile $tgz -TimeoutSec 180
          $actual = (Get-FileHash -Path $tgz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $sha) {
            throw "PDFium: sha256 не совпал: $actual (ожидался $sha)"
          }
          $dir = Join-Path $env:RUNNER_TEMP 'pdfium'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          tar -xzf $tgz -C $dir
          $lib = Join-Path $dir 'bin/pdfium.dll'
          if (-not (Test-Path $lib)) {
            throw "PDFium: в архиве $asset нет bin/pdfium.dll"
          }
          "PDFIUM_PATH=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "PDFium для тестов: $lib"
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Тесты (кроме golden)
        shell: bash
        run: |
          set -o pipefail
          flutter test --exclude-tags golden --coverage 2>&1 | tee test-output.log
      - name: Детали падения тестов (аннотация)
        if: failure()
        shell: bash
        run: |
          # Публикуем хвост вывода тестов как аннотацию check-run, чтобы
          # причина падения была видна без доступа к полному логу job.
          if [ -f test-output.log ]; then
            MSG=$(tail -n 120 test-output.log | sed -e 's/%/%25/g' -e 's/\r//g')
            MSG="${MSG//$'\n'/%0A}"
            MSG="${MSG:0:60000}"
            echo "::error title=Детали падения тестов::$MSG"
          fi
      - name: Покрытие рукописного кода >= 80%
        if: matrix.os == 'ubuntu-latest'
        run: dart run tool/coverage_check.dart --min=80
      - name: Загрузка lcov
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

  build-desktop:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            command: flutter build linux --release
          - name: windows
            os: windows-latest
            command: flutter build windows --release
          - name: macos
            os: macos-latest
            command: flutter build macos --release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          echo "== df -h до очистки =="
          df -h
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo rm -rf /usr/share/dotnet
            sudo rm -rf /usr/local/lib/android
            sudo rm -rf /opt/ghc
            sudo rm -rf /usr/local/share/boost
            sudo rm -rf /opt/hostedtoolcache/CodeQL
            if command -v docker >/dev/null 2>&1; then
              sudo docker image prune --all --force || true
            fi
          elif [ "$RUNNER_OS" = "macOS" ]; then
            sudo rm -rf /Users/runner/Library/Android/sdk
            sudo rm -rf /Users/runner/Library/Caches/Homebrew
            sudo rm -rf /usr/local/share/dotnet
          fi
          echo "== df -h после очистки =="
          df -h
      - id: fvm
        uses: kuhnroyal/flutter-fvm-config-action@v3.3
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Системные зависимости Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          # libsecret-1-dev обязателен для flutter_secure_storage_linux
          # (pkg-config: libsecret-1 >= 0.18.4), остальное — для Linux desktop.
          sudo apt-get install -y libgtk-3-dev liblzma-dev ninja-build libsecret-1-dev
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: ${{ matrix.command }}

  build-mobile:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android
            os: ubuntu-latest
          - name: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        env:
          # /usr/local/lib/android нужен этой Android-сборке: без SDK упадёт
          # `flutter build apk`, поэтому в android-job SDK сохраняем, а остальные
          # Linux-job (quality/test/build-linux) его освобождают.
          KEEP_ANDROID_SDK: ${{ matrix.name == 'android' }}
        run: |
          set -euo pipefail
          echo "== df -h до очистки =="
          df -h
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo rm -rf /usr/share/dotnet
            if [ "${KEEP_ANDROID_SDK:-false}" != "true" ]; then
              sudo rm -rf /usr/local/lib/android
            else
              echo "Android SDK сохранён: нужен для flutter build apk"
            fi
            sudo rm -rf /opt/ghc
            sudo rm -rf /usr/local/share/boost
            sudo rm -rf /opt/hostedtoolcache/CodeQL
            if command -v docker >/dev/null 2>&1; then
              sudo docker image prune --all --force || true
            fi
          elif [ "$RUNNER_OS" = "macOS" ]; then
            sudo rm -rf /Users/runner/Library/Android/sdk
            sudo rm -rf /Users/runner/Library/Caches/Homebrew
            sudo rm -rf /usr/local/share/dotnet
          fi
          echo "== df -h после очистки =="
          df -h
      - id: fvm
        uses: kuhnroyal/flutter-fvm-config-action@v3.3
      - uses: actions/setup-java@v6.2.0
        if: matrix.name == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Free disk space (Android Gradle cache)
        if: matrix.name == 'android'
        shell: bash
        run: |
          # Кэш Gradle раздувается до нескольких GB и переживает прогоны на
          # self-hosted/cached раннере; перед сборкой начинаем с чистого кэша.
          set -euo pipefail
          echo "== df -h до очистки кэша Gradle =="
          df -h
          rm -rf "$HOME/.gradle/caches"
          echo "== df -h после очистки кэша Gradle =="
          df -h
      - name: Сборка Android (debug, без подписи)
        if: matrix.name == 'android'
        run: flutter build apk --debug
      - name: Сборка iOS (release, без подписи)
        if: matrix.name == 'ios'
        run: flutter build ios --release --no-codesign
